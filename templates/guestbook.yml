# Copy to .github/workflows/guestbook.yml.
# Turn on Discussions (Settings > General > Features) and open a discussion with
# "Guestbook" in its title. Visitors sign it by leaving a comment.

name: guestbook

on:
  discussion_comment:
    types: [created, edited, deleted]
  discussion:
    types: [edited]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

env:
  CUTE_README_REPO: kimjungminn24/cute-readme
  GUESTBOOK_DISCUSSION: ''      # discussion number; empty finds the one titled "Guestbook"
  GUESTBOOK_THEME: pixel        # pixel, light, dark
  GUESTBOOK_TITLE: Guestbook
  GUESTBOOK_LIMIT: 8
  GUESTBOOK_WIDTH: 520

concurrency:
  group: guestbook
  cancel-in-progress: false

permissions:
  contents: write
  discussions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CUTE_README_REPO }}
          path: .cute-readme

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node .cute-readme/scripts/render-guestbook.js "$GITHUB_REPOSITORY" guestbook.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guestbook.svg
          git diff --cached --quiet || { git commit -m "update guestbook"; git pull --rebase origin "$GITHUB_REF_NAME"; git push; }
