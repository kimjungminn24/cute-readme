<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%209%209'%3E%3Cstyle%3Epath{fill:%23111}@media(prefers-color-scheme:dark){path{fill:%23fff}}%3C/style%3E%3Cpath%20d='M1%200h2v1h-2zM6%200h2v1h-2zM0%201h4v1h-4zM5%201h4v1h-4zM0%202h9v1h-9zM0%203h9v1h-9zM1%204h7v1h-7zM1%205h7v1h-7zM2%206h5v1h-5zM3%207h3v1h-3zM4%208h1v1h-1z'/%3E%3C/svg%3E">
<title>cute-readme editor</title>
<style>
  :root {
    --paper: #e8e8e8;
    --card: #ffffff;
    --ink: #111111;
    --ink-mid: #444444;
    --ink-dim: #6f6f6f;
    --line: #c6c6c6;
    --line-soft: #e2e2e2;
    --line-strong: #8a8a8a;
    --surface: #f4f4f4;

    --accent: #111111;
    --accent-deep: #000000;
    --hi: #8a8a8a;
    --hi-soft: #efefef;
    --accent-ink: #ffffff;

    --on: #e4e4e4;
    --on-ring: #111111;
    --ghost: #f0f0f0;
    --danger: #b3261e;
    --danger-soft: #f7eceb;
    --radius: 0;
    --shadow: 3px 3px 0 var(--ink);
    --btn-h: 32px;
    --tile: 52px;
    --mono: 'Consolas', 'D2Coding', 'Menlo', monospace;
  }

  * { box-sizing: border-box; margin: 0; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dots button:focus-visible, .chips button:focus-visible { outline-offset: 1px; }

  .flip, .row button, .l-del, .tools button, .chips button,
  .tabs button, input, select {
    transition: none;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  body {
    font: 14px/1.5 -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: var(--paper); color: var(--ink);
    display: flex; flex-direction: column;
    gap: 10px; padding: 12px; min-height: 100vh;
  }
  .panel {
    background: var(--card); border: 2px solid var(--ink);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }

  .flip, .row button, .l-del, .tools button.label {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: var(--btn-h); padding: 0 12px;
    border: 2px solid var(--ink); border-radius: var(--radius);
    background: var(--card); color: var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    font: 600 12px var(--mono); white-space: nowrap;
    cursor: pointer;
  }
  .flip:hover, .row button:hover, .l-del:hover, .tools button.label:hover {
    background: var(--hi-soft);
  }

  .flip:active, .row button:active, .l-del:active, .tools button:active {
    transform: translate(2px, 2px); box-shadow: none;
  }

  .flip[aria-pressed='true'], .tools button.label.active {
    background: var(--accent); color: var(--accent-ink);
  }
  .flip[aria-pressed='true']:hover, .tools button.label.active:hover {
    background: var(--accent-deep);
  }
  .flip:disabled, .row button:disabled {
    opacity: 1; cursor: default; color: var(--ink-dim);
    border-color: var(--line); box-shadow: 2px 2px 0 var(--line);
  }
  .flip:disabled:hover, .row button:disabled:hover { background: var(--card); }
  .flip:disabled:active, .row button:disabled:active {
    transform: none; box-shadow: 2px 2px 0 var(--line);
  }

  .row button.ghost { background: var(--ghost); }
  .row button.ghost:hover { background: var(--line-soft); }

  .row button.primary { background: var(--accent); color: var(--accent-ink); }
  .row button.primary:hover { background: var(--accent-deep); }

  .l-del { flex: none; width: var(--btn-h); padding: 0; font-size: 13px; color: var(--ink-dim); }
  .l-del:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }


  .view { display: none; flex-direction: column; gap: 12px; }
  .view.active { display: flex; }

  #stage {
    display: flex; align-items: center; justify-content: center;

    padding: 10px; height: 42vh; max-height: 360px;
  }

  #stage svg { width: 100%; height: 100%; touch-action: none; }
  #stage [data-cell]:hover, #stage [data-wall]:hover { fill: rgba(17, 17, 17, 0.3); cursor: pointer; }
  #stage.dragging { cursor: grabbing; }
  #stage.dragging [data-cell]:hover, #stage.dragging [data-wall]:hover { fill: rgba(17, 17, 17, 0.14); cursor: grabbing; }

  #stage .held { opacity: 0.45; }
  #stage.holding, #stage.holding [data-cell]:hover, #stage.holding [data-wall]:hover { cursor: copy; }

  .panels { display: flex; flex-direction: column; gap: 12px; }

  h2 {
    display: flex; align-items: center; gap: 8px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-dim); margin: 14px 0 7px;
  }
  h2::after { content: ''; flex: 1; height: 1px; background: var(--line-soft); }

  .tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 2px solid var(--line); }
  .tabs button {
    border: none; background: none; cursor: pointer;
    font: 600 12px var(--mono); color: var(--ink-dim);
    height: 34px; padding: 0 10px; margin-bottom: -2px;
    border-bottom: 3px solid transparent;
  }
  .tabs button:hover { color: var(--ink); background: var(--hi-soft); }
  .tabs button.active { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }

  .panel.box { padding: 12px 14px; }

  .tools { display: none; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tools.active { display: flex; }

  .pane { display: none; margin-top: 12px; }
  .pane.active { display: block; }

  .tools button {
    width: var(--tile); height: var(--tile); padding: 3px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--ink); background: var(--surface);
    border-radius: var(--radius); box-shadow: 2px 2px 0 var(--ink); cursor: pointer;
  }
  .tools button:hover { background: var(--hi-soft); }
  .tools button.active { background: var(--on); box-shadow: 2px 2px 0 var(--ink), inset 0 0 0 2px var(--on-ring); }
  .tools button svg { display: block; width: 100%; height: 100%; }

  .tools button.label { width: auto; height: var(--btn-h); }

  .tools button.swatch { padding: 0; overflow: hidden; }

  .edit-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding-bottom: 10px; border-bottom: 1px solid var(--line-soft);
  }
  .tools.edit-tools { display: flex; margin-top: 0; margin-right: auto; }

  .tools .tool-row-label {
    flex: 1 1 100%; margin: 2px 0 0;
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-dim);
  }

  .tools svg, .tools svg *,
  .chips svg, .chips svg * { animation: none !important; }

  #measurer { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; font-size: 13px; }

  input[type="color"], input[type="text"], select {
    height: var(--btn-h); border: 2px solid var(--ink); border-radius: var(--radius);
    background: var(--card); color: var(--ink); font-size: 13px;
  }
  input[type="color"] { width: 46px; padding: 2px; }
  input[type="text"], select { padding: 0 8px; width: 130px; }
  input[type="text"]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 6px 18px; align-items: center; }

  .fields > label { display: grid; grid-template-columns: 74px minmax(0, 1fr); align-items: center; gap: 10px; width: auto; margin: 0; }
  .fields > label.slider { grid-template-columns: 74px minmax(0, 1fr) auto; max-width: none; }

  .fields > label input[type="text"], .fields > label select { width: 100%; }

  .fields > label input[type="checkbox"] { justify-self: start; }

  label.slider { gap: 10px; flex: 0 1 340px; max-width: 340px; }

  label.slider > span { flex: 0 0 74px; }
  label.slider input[type="range"] { flex: 1 1 120px; min-width: 90px; height: var(--btn-h); accent-color: var(--accent); }

  label.slider output {
    flex: 0 0 auto; min-width: 52px; text-align: right;
    font: 11px var(--mono); color: var(--ink-mid); font-variant-numeric: tabular-nums;
  }

  .preview {
    display: flex; align-items: center; justify-content: center;
    padding: 14px; min-height: 92px;
  }

  .preview:empty::before { content: attr(data-empty); font-size: 13px; color: var(--ink-dim); }

  .person { display: flex; gap: 12px; align-items: flex-start; }

  .person-stage {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 10px 12px; border: 2px solid var(--ink); border-radius: var(--radius);
    background-color: #f0f0f0;
    background-image:
      linear-gradient(45deg, #d8d8d8 25%, transparent 25%, transparent 75%, #d8d8d8 75%),
      linear-gradient(45deg, #d8d8d8 25%, transparent 25%, transparent 75%, #d8d8d8 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }
  #p-preview svg { display: block; }

  .person-stage .flip { width: 100%; }

  .person-stage.gone #p-preview { opacity: 0.25; filter: grayscale(1); }
  .person-form { flex: 1 1 180px; min-width: 0; }
  .person-form h2:first-child { margin-top: 0; }

  .chip-row[hidden] { display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }

  .chips button {
    padding: 1px; cursor: pointer; line-height: 0;
    border: 2px solid var(--ink); background: var(--surface); border-radius: var(--radius);
  }
  .chips button:hover { background: var(--hi-soft); }
  .chips button.on {
    background: var(--on); border-color: var(--on-ring); box-shadow: inset 0 0 0 2px var(--on-ring);
  }

  .tone[hidden] { display: none; }
  .tone { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .tone > span:first-child {
    flex: 0 0 44px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-dim);
  }

  .dots { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
  .dots button {
    width: 16px; height: 16px; padding: 0; cursor: pointer;
    border: 1px solid rgba(0, 0, 0, 0.35);
  }
  .dots button.on { box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--accent); }

  #rc-preview { flex-direction: column; gap: 8px; }
  #rc-preview .rc-item { display: flex; align-items: flex-start; gap: 8px; }
  #rc-preview .rc-link { display: block; min-width: 0; }
  #rc-preview svg { display: block; max-width: 100%; }

  .text-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  .text-row .b-text { flex: 1 1 180px; width: auto; min-width: 0; }
  .text-row .b-at { font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
  .text-row select { width: 92px; }

  .link-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  .link-row .l-label { width: 110px; }
  .link-row .l-url { flex: 1 1 180px; width: auto; min-width: 0; }
  .link-row select { width: 108px; }

  #links-preview { flex-wrap: wrap; gap: 6px; }
  #links-preview svg { display: block; }

  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .hint {
    font-size: 12px; color: var(--ink-dim); margin-top: 8px;
    padding-left: 9px; border-left: 2px solid var(--line-soft); max-width: 78ch;
  }
  code { background: var(--ghost); border-radius: 0; padding: 1px 5px; font: 11px var(--mono); color: var(--ink); }

  .b-at, #rs-size { font-family: var(--mono); }

  @media (max-width: 720px) {
    body { padding: 8px; gap: 8px; }
    #stage { height: 44vh; padding: 6px; }

    :root { --tile: 56px; --btn-h: 36px; }
    .tabs button { padding: 0 11px; }
    input[type="text"], select { width: 55%; }
  }
  @media (pointer: coarse) {
    :root { --btn-h: 40px; }
    .dots button { width: 28px; height: 28px; }
  }

  body.embedded { padding: 6px; gap: 6px; }
  body.embedded #stage { height: 36vh; }
</style>
</head>
<body>
<datalist id="scale-stops"><option value="0"></option><option value="1"></option><option value="2"></option><option value="3"></option><option value="4"></option><option value="5"></option><option value="6"></option><option value="7"></option><option value="8"></option><option value="9"></option><option value="10"></option><option value="11"></option></datalist>
  <main>
  <section class="view active" data-view="room">
    <div class="panel" id="stage" aria-label="Room preview"></div>
    <div class="panels">
      <div class="panel box" id="toolbox">
        <div class="edit-bar">
          <div class="tools edit-tools" id="tools-edit"></div>
          <button type="button" id="demo" class="flip">Load demo</button>
          <button type="button" id="reset" class="flip">Reset room</button>
        </div>
        <div class="tabs" id="tabs" role="tablist">
          <button type="button" role="tab" data-tab="item">Items</button>
          <button type="button" role="tab" data-tab="wall">Wall</button>
          <button type="button" role="tab" data-tab="skill">Skills</button>
          <button type="button" role="tab" data-tab="pattern">Pattern</button>
          <button type="button" role="tab" data-tab="size">Size</button>
          <button type="button" role="tab" data-tab="person">Person</button>
          <button type="button" role="tab" data-tab="text">Text</button>
        </div>
        <div class="tools" id="tools-item" data-tab="item"></div>
        <div class="tools" id="tools-wall" data-tab="wall"></div>
        <div class="tools" id="tools-skill" data-tab="skill"></div>
        <div class="tools" id="tools-pattern" data-tab="pattern"></div>

        <div class="pane" data-tab="pattern">
          <h2>Colors</h2>
          <label>Wall <input type="color" id="t-wall"></label>
          <label>Floor <input type="color" id="t-floor"></label>

          <label>Season <select id="t-weather"></select></label>
        </div>

        <div class="pane size-form" data-tab="size">
          <h2>Room grid</h2>
          <label class="slider"><span>Columns</span> <input type="range" id="rs-cols" min="4" max="12" step="1"><output id="rs-cols-out"></output></label>
          <label class="slider"><span>Rows</span> <input type="range" id="rs-rows" min="4" max="12" step="1"><output id="rs-rows-out"></output></label>
          <h2>Image size</h2>
          <label class="slider"><span>Scale</span> <input type="range" id="rs-scale" min="0" max="11" step="1" list="scale-stops"><output id="rs-scale-out"></output></label>
          <p class="hint" id="rs-size"></p>
        </div>
        <div class="pane" data-tab="person">
          <div class="person">
            <div class="person-stage">
              <div id="p-preview"></div>
              <button type="button" id="p-flip" class="flip" aria-pressed="false">⇄ Flip</button>
              <button type="button" id="p-remove" class="flip">✕ Remove</button>
            </div>
            <div class="person-form">
              <div class="chip-row"><h2>Shape</h2><div class="chips" id="p-shapes"></div></div>
              <div class="chip-row"><h2>Hair</h2><div class="chips" id="p-hairs"></div></div>
              <div class="chip-row"><h2>Outfit</h2><div class="chips" id="p-outfits"></div></div>
              <div class="chip-row"><h2>Pose</h2><div class="chips" id="p-poses"></div></div>
              <label>Motion <select id="p-anim"></select></label>
              <h2>Colors</h2>
              <div class="tone"><span>Skin</span><span class="dots" id="p-skin-dots"></span><input type="color" id="p-skin"></div>
              <div class="tone"><span>Hair</span><span class="dots" id="p-hair-dots"></span><input type="color" id="p-hair"></div>
              <div class="tone"><span>Top</span><span class="dots" id="p-top-dots"></span><input type="color" id="p-top"></div>
              <div class="tone"><span>Bottom</span><span class="dots" id="p-bottom-dots"></span><input type="color" id="p-bottom"></div>

              <div class="chip-row"><h2>Face</h2><div class="chips" id="p-faces"></div></div>
              <div class="chip-row"><h2>Accessory</h2><div class="chips" id="p-accs"></div></div>
              <div class="chip-row"><h2>Size</h2><div class="chips" id="p-sizes"></div></div>
            </div>
          </div>
        </div>
        <div class="pane" data-tab="text">
          <div id="text-rows"></div>
          <div class="row">
            <button id="text-add" class="ghost">+ Add text</button>
          </div>
        </div>
      </div>
    </div>
  </section>
  </main>
  <svg id="measurer" aria-hidden="true"></svg>

  <script type="module" src="./editor.js"></script>
</body>
</html>
